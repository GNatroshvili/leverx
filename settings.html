<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LeverX Employee Services - Admin Settings page for managing employee services."
    />
    <link rel="icon" type="image/png" href="./assets/favicon-icon.png" />
    <title>LeverX Employee Services - Admin Settings</title>
  </head>
  <body>
    <header>
      <div class="header-wrapper container">
        <div class="header-title">
          <a class="company-name" href="./index.html">Leverx</a>
          <p class="page-service">EMPLOYEE SERVICES</p>
        </div>
        <div class="header-options-wrapper">
          <button class="page-title">Address Book</button>
          <button class="page-title">Settings</button>
        </div>
        <div class="header-actions">
          <div class="support-and-user-wrapper">
            <div class="support-btn">
              <img src="./assets/question-mark.png" alt="support-icon" />
              <p class="support-btn-text">Support</p>
            </div>
            <div class="user-data">
              <img
                src="./assets/user.png"
                alt="employee-avatar"
                id="employee-avatar"
              />
              <p class="username" id="employee-username">Joe Doe</p>
            </div>
          </div>
          <div class="logout-btn">
            <img src="./assets/logout.png" alt="logout-icon" />
          </div>
        </div>
        <input type="checkbox" id="burger-toggle" class="burger-checkbox" />
        <div class="menu-backdrop"></div>
        <label for="burger-toggle" class="burger-menu-wrapper">
          <span class="burger-line"></span>
          <span class="burger-line"></span>
          <span class="burger-line"></span>
        </label>
        <nav class="mobile-nav">
          <div class="nav-wrapper">
            <img
              src="./assets/avatar.png"
              alt="avatar"
              class="burger-avatar"
              id="mobile-employee-avatar"
            />
            <div class="nav-actions-wrapper">
              <p id="mobile-employee">Joe Doe</p>
              <a href="/" class="sign-out-link">Sign Out</a>
            </div>
          </div>
          <div class="list-divider-line"></div>
          <p class="nav-address-book">Address Book</p>
          <div class="list-divider-line"></div>
          <div class="visible-support-btn">
            <img src="./assets/question-mark.png" alt="support-icon" />
            <p class="support-btn-text">Support</p>
          </div>
        </nav>
      </div>
    </header>
    <div class="container">
      <div class="setting-card-wrapper">
        <div class="settings-card-title">
          <h1 class="settings-title">ROLES & PERMISSIONS</h1>
        </div>
        <div class="divider-line"></div>
        <div class="navigation-wrapper">
          <div>
            <div class="settings-search-wrapper">
              <input
                type="text"
                class="settings-search-input"
                placeholder="Type to search"
              />
              <img
                src="./assets/search-icon.png"
                alt="search-icon"
                class="settings-search-icon"
              />
            </div>
          </div>
          <div class="address-book-role-wrapper">
            <div class="vertical-divider"></div>
            <p class="address-book-title">Address book role</p>
          </div>
          <div class="admin-column-wrapper">
            <div class="vertical-divider"></div>
            <p class="admin-title">Admin</p>
          </div>
        </div>
        <div class="divider-line"></div>
        <div class="employee-list-wrapper">
        </div>
      </div>
    </div>
  </body>
</html>
