<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LeverX Employee Services - Sign in or sign up to access the employee address book."
    />
    <link rel="icon" type="image/png" href="./assets/favicon-icon.png" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/authorization.css" />
    <title>LeverX Employee Services - Authorization</title>
  </head>
  <body>
    <header>
      <div class="header-wrapper container">
        <div class="header-title">
          <a class="company-name" href="./index.html">Leverx</a>
          <p class="page-service">EMPLOYEE SERVICES</p>
        </div>
        <div class="header-actions auth-header-actions">
          <div class="support-btn">
            <img src="./assets/question-mark.png" alt="support-icon" />
            <p class="support-btn-text">Support</p>
          </div>
        </div>
        <div class="burger-menu-wrapper">
          <span class="burger-line"></span>
          <span class="burger-line"></span>
          <span class="burger-line"></span>
        </div>
        <div class="menu-backdrop"></div>
        <nav class="mobile-nav">
          <div class="nav-wrapper">
            <div class="nav-actions-wrapper">
              <p>Welcome to LeverX</p>
            </div>
          </div>
          <div class="list-divider-line"></div>
          <div class="visible-support-btn">
            <img src="./assets/question-mark.png" alt="support-icon" />
            <p class="support-btn-text">Support</p>
          </div>
        </nav>
      </div>
    </header>

    <div class="auth-page-wrapper container">
      <div class="auth-container">
        <div class="auth-tabs">
          <button class="auth-tab active" id="signin-tab">SIGN IN</button>
          <button class="auth-tab" id="signup-tab">SIGN UP</button>
        </div>

        <!-- Sign In Form -->
        <div class="auth-form-wrapper" id="signin-form-wrapper">
          <form class="auth-form" id="signin-form">
            <div class="form-group">
              <label class="input-label" for="signin-username">Username</label>
              <input
                type="text"
                class="auth-input"
                id="signin-username"
                placeholder="Enter your username"
                required
              />
            </div>
            <div class="form-group">
              <label class="input-label" for="signin-password">Password</label>
              <input
                type="password"
                class="auth-input"
                id="signin-password"
                placeholder="Enter your password"
                required
              />
            </div>
            <div class="form-group">
              <button type="submit" class="auth-btn">Sign In</button>
            </div>
            <div>
              <input
                type="checkbox"
                id="signin-remember"
              />
              <label for="signin-remember"
                >Remember me</label
              >
            </div>
            <p class="auth-switch-text">
              Don't have an account?
              <a href="#" class="auth-switch-link" id="go-to-signup">Sign Up</a>
            </p>
          </form>
        </div>

        <!-- Sign Up Form -->
        <div
          class="auth-form-wrapper"
          id="signup-form-wrapper"
          style="display: none"
        >
          <form class="auth-form" id="signup-form">
            <div class="form-group">
              <label class="input-label" for="signup-username">Username</label>
              <input
                type="text"
                class="auth-input"
                id="signup-username"
                placeholder="Choose a username"
                required
              />
            </div>
            <div class="form-group">
              <label class="input-label" for="signup-password">Password</label>
              <input
                type="password"
                class="auth-input"
                id="signup-password"
                placeholder="Create a password"
                required
              />
            </div>
            <div class="form-row">
              <div class="form-group half">
                <label class="input-label" for="signup-firstname"
                  >First Name</label
                >
                <input
                  type="text"
                  class="auth-input"
                  id="signup-firstname"
                  placeholder="John"
                  required
                />
              </div>
              <div class="form-group half">
                <label class="input-label" for="signup-lastname"
                  >Last Name</label
                >
                <input
                  type="text"
                  class="auth-input"
                  id="signup-lastname"
                  placeholder="Doe"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label class="input-label" for="signup-phone">Phone Number</label>
              <input
                type="tel"
                class="auth-input"
                id="signup-phone"
                placeholder="+1 234 567 8900"
                required
              />
            </div>
            <div class="form-group">
              <button type="submit" class="auth-btn">Sign Up</button>
            </div>
            <p class="auth-switch-text">
              Already have an account?
              <a href="#" class="auth-switch-link" id="go-to-signin">Sign In</a>
            </p>
          </form>
        </div>
      </div>
    </div>
    <script src="./dist/scripts/authorization.js" type="module"></script>
  </body>
</html>
